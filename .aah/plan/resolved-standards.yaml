- id: RX-A11Y-002
  category: accessibility
  priority: medium
  description: All images must have meaningful alt text. Decorative images should
    have alt=''. Form inputs must have associated labels.
  remediation: Add alt attributes to <img>. Add <label htmlFor> for every <input>.
  source: industry-default
- id: RX-PERF-001
  category: performance
  priority: medium
  description: Avoid unnecessary re-renders. Use React.memo for expensive pure components,
    useMemo for expensive computations, and useCallback for callback props.
  remediation: Wrap expensive components in React.memo(). Use useMemo/useCallback
    where profiling shows wasted renders.
  source: industry-default
- id: PG-PERF-003
  category: performance
  priority: medium
  description: Avoid SELECT * in production queries. Select only the columns needed
