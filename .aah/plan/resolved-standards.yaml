rules:
- id: EXTRACTED-022
  category: conventions
  priority: critical
  description: The server must never silently turn an entered `$47` into another amount.
  source: company
- id: EXTRACTED-046
  category: conventions
  priority: critical
  description: Disconnect recovery must respect multi-window ownership. Entertainment
    features must never compromise auction correctness.
  source: company
- id: TS-SEC-001
  category: security
  priority: critical
  description: No hardcoded credentials, API keys, tokens, or secrets in source code
    or client-side bundles.
  remediation: Use environment variables with typed config objects, or a secrets manager.
  source: industry-default
- id: TS-SEC-002
  category: security
  priority: critical
  description: 'Prevent XSS: never insert unsanitized user input into innerHTML or
    dangerouslySetInnerHTML.'
  remediation: Use textContent, sanitize with DOMPurify, or use framework-provided
    escaping.
  source: industry-default
- id: RX-SEC-001
  category: security
  priority: critical
  description: Never use dangerouslySetInnerHTML with unsanitized user input. If HTML
    rendering is required, sanitize with DOMPurify first.
  remediation: Use DOMPurify.sanitize(userInput) before passing to dangerouslySetInnerHTML,
    or avoid it entirely.
  source: industry-default
- id: RX-SEC-002
  category: security
  priority: critical
  description: Never store secrets, API keys, or tokens in client-side code, localStorage,
    or sessionStorage. Use httpOnly cookies for auth tokens.
  remediation: Move secrets to server-side. Store auth tokens in httpOnly, secure,
    sameSite cookies.
  source: industry-default
- id: PG-SEC-001
  category: security
  priority: critical
  description: Always use parameterized queries or ORM methods. Never concatenate
    user input into SQL strings, even for table/column names.
  remediation: Use bind parameters ($1, %s) or ORM query builders. For dynamic identifiers,
    use a whitelist.
  source: industry-default
- id: EXTRACTED-001
  category: authentication
  priority: high
  description: Postgres rows (`DraftTeamState`, `PlayerAuction`, `Acquisition`, `RosterEntry`,
    ledger) are live authority; the `DraftEvent` log exists for audit and WebSocket
    reconnect replay ("what did I miss"), not for reconstructing arbitrary past state
    — bounded rollback means we never need to.
  source: company
- id: EXTRACTED-002
  category: conventions
  priority: high
  description: '**DraftEvent and its row effects commit in the same transaction, always.**
    Never a separate write.'
  source: company
- id: EXTRACTED-003
  category: observability
  priority: high
  description: '`sequence` is allocated from a per-draft counter inside that transaction,
    so the event log and the materialized rows can never diverge — this is what makes
    reconnect replay trustworthy.'
  source: company
- id: EXTRACTED-004
  category: conventions
  priority: high
  description: '**In-memory state updates only after commit succeeds.** On commit
    failure, in-memory state is untouched and the command is rejected back to its
    client — never partially applied.'
  source: company
- id: EXTRACTED-005
  category: architecture
  priority: high
  description: On restart, any `Draft` found `RUNNING` is force-restored to `PAUSED`
    (never resumed against an already-expired deadline, which would otherwise auto-award
    the live auction to whoever led at crash time with no human check) — see `state-machine-flows.md`
    §25.
  source: company
- id: EXTRACTED-006
  category: architecture
  priority: high
  description: Restricting in-place correction to price (which never changes eligibility
    or cascades to other teams) removes the need to validate a second team's feasibility
    inline.
  source: company
- id: EXTRACTED-007
  category: conventions
  priority: high
  description: All draft state, timers, nomination cursors, command queues, and WS
    broadcast groups are keyed by `draft_id` — never a module-level singleton.
  source: company
- id: EXTRACTED-008
  category: authentication
  priority: high
  description: '**Acceptance:** `npm run dev` starts server + web; web shows "connected";
    two browser tabs can open two different fake `draft_id`s and receive independent
    echoes; a socket that never sends `AUTH` is closed after ~5s; `npm test` runs;
    typechecker runs clean.'
  source: company
- id: EXTRACTED-010
  category: architecture
  priority: high
  description: Nomination audio flow (§12), presentation-only, never blocks the auction.
