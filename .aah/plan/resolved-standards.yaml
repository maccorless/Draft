- id: TS-TYPE-001
  category: type_safety
  priority: high
  description: Never use 'any' type. Use 'unknown' for truly unknown types and narrow
    with type guards.
  remediation: Replace 'any' with specific types, union types, generics, or 'unknown'
    with runtime checks.
  source: industry-default
- id: TS-TYPE-002
  category: type_safety
  priority: high
  description: 'Enable strict mode in tsconfig.json: strict: true (includes strictNullChecks,
    noImplicitAny, strictFunctionTypes).'
  remediation: 'Set "strict": true in tsconfig.json compilerOptions.'
  source: industry-default
- id: TS-TEST-001
  category: testing
  priority: high
  description: New feature code must have at least 80% line coverage with functional
    tests. No mock frameworks allowed.
  remediation: Add functional tests with real services. Use type-safe test utilities.
  source: industry-default
- id: TS-ERR-001
  category: error_handling
  priority: high
  description: Define typed error classes instead of throwing plain strings or generic
    Error. Use Result types for recoverable failures.
  remediation: Create custom error classes extending Error, or use a Result<T, E>
    pattern.
  source: industry-default
- id: RX-ARCH-001
  category: architecture
  priority: high
  description: 'Follow React hooks rules: only call hooks at the top level (never
    inside loops, conditions, or nested functions). Only call hooks from React function
    components or custom hooks.'
  remediation: Move hook calls to the top level of the component function. Extract
    conditional logic below the hook calls.
  source: industry-default
- id: RX-ARCH-002
  category: architecture
  priority: high
  description: Components should be small and focused on one responsibility. Extract
    reusable UI into shared components. Keep business logic out of components — use
    custom hooks or service modules.
  remediation: Split large components. Move data fetching to custom hooks. Move business
    logic to utility modules.
  source: industry-default
- id: RX-A11Y-001
  category: accessibility
  priority: high
  description: All interactive elements must be keyboard accessible. Use semantic
    HTML (button, a, input) instead of div/span with onClick. Add aria-label for icon-only
    buttons.
  remediation: Replace <div onClick> with <button>. Add aria-label, role, and tabIndex
    where needed.
  source: industry-default
- id: PG-SEC-002
  category: security
  priority: high
  description: Use least-privilege database roles. Application should connect with
    a role that has only SELECT/INSERT/UPDATE/DELETE — not SUPERUSER, CREATEDB, or
    DROP.
  remediation: Create a dedicated application role with GRANT only on needed tables
    and operations.
  source: industry-default
- id: PG-PERF-001
  category: performance
  priority: high
  description: Add indexes on columns used in WHERE, JOIN, and ORDER BY clauses for
    tables expected to exceed 10,000 rows. Include foreign key columns.
  remediation: Add CREATE INDEX on frequently queried columns. Use EXPLAIN ANALYZE
    to verify index usage.
  source: industry-default
- id: PG-PERF-002
  category: performance
  priority: high
  description: Use connection pooling (PgBouncer, SQLAlchemy pool, asyncpg pool).
    Never open a new connection per request.
  remediation: Configure connection pool with appropriate pool_size (5-20) and max_overflow.
    Use pool_pre_ping for stale connection detection.
  source: industry-default
- id: PG-DATA-001
  category: data_integrity
  priority: high
  description: Use database-level constraints (NOT NULL, UNIQUE, CHECK, FOREIGN KEY)
    to enforce data integrity. Do not rely solely on application-level validation.
  remediation: Add constraints in migrations. Use NOT NULL, UNIQUE, CHECK constraints,
    and FOREIGN KEY references.
  source: industry-default
- id: PG-DATA-002
  category: data_integrity
  priority: high
  description: Wrap multi-step data modifications in explicit transactions. Use SAVEPOINT
    for partial rollback in complex workflows.
  remediation: Use BEGIN/COMMIT/ROLLBACK or ORM transaction context managers for multi-statement
    operations.
  source: industry-default
- id: EXTRACTED-009
  category: conventions
  priority: medium
  description: PDF parsing and large CSV imports should run off the main event loop
