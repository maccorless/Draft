openapi: "3.1.0"
info:
  title: MOD-001 Player Dataset Management
  version: "1.0.0"
  description: |
    League/team setup CRUD, auction and roster configuration, CSV player data import,
    and dataset freeze. A dataset must be FROZEN before a draft can reference it.

security:
  - bearerAuth: []

paths:
  /leagues:
    post:
      operationId: createLeague
      summary: Create a new league (commissioner setup)
      tags: [league]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: League created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSummary"

  /leagues/{leagueId}:
    get:
      operationId: getLeague
      summary: Get league details (id, name)
      tags: [league]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      responses:
        "200":
          description: League summary (no password hashes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSummary"

  /leagues/{leagueId}/teams:
    get:
      operationId: listTeams
      summary: List all teams in the league
      tags: [league]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      responses:
        "200":
          description: Array of team summaries (no password hashes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"

    post:
      operationId: createTeam
      summary: Add a team to the league
      tags: [league]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSummary"

  /leagues/{leagueId}/players:
    get:
      operationId: listPlayers
      summary: List all players in the league's active dataset
      tags: [dataset]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      responses:
        "200":
          description: Players with AAV, projections, tier from the active dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerListResponse"

  /leagues/{leagueId}/config/roster:
    put:
      operationId: setRosterConfig
      summary: Set roster slot definitions for the league
      tags: [league]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterConfigRequest"
      responses:
        "200":
          description: Roster configuration saved

  /leagues/{leagueId}/config/auction:
    put:
      operationId: setAuctionConfig
      summary: Set auction timer and budget configuration for the league
      tags: [league]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionConfigRequest"
      responses:
        "200":
          description: Auction configuration saved

  /leagues/{leagueId}/datasets:
    post:
      operationId: createDataset
      summary: Create a new draft dataset (empty; ready for import)
      tags: [dataset]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      responses:
        "201":
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSummary"

  /leagues/{leagueId}/datasets/{datasetId}/import/csv:
    post:
      operationId: importDatasetCsv
      summary: Import players from a CSV file into the dataset
      tags: [dataset]
      parameters:
        - $ref: "#/components/parameters/leagueId"
        - $ref: "#/components/parameters/datasetId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result with row count and any validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /leagues/{leagueId}/datasets/{datasetId}/freeze:
    post:
      operationId: freezeDataset
      summary: Freeze the dataset; no further modifications allowed after this
      tags: [dataset]
      parameters:
        - $ref: "#/components/parameters/leagueId"
        - $ref: "#/components/parameters/datasetId"
      responses:
        "200":
          description: Dataset is now FROZEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSummary"

  /leagues/{leagueId}/drafts:
    post:
      operationId: createDraft
      summary: Create a new draft referencing a FROZEN dataset
      tags: [draft]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "201":
          description: Draft created in CREATED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDraftResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    leagueId:
      name: leagueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    datasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    CreateLeagueRequest:
      type: object
      required: [name, site_password, commissioner_password]
      properties:
        name:
          type: string
        site_password:
          type: string
        commissioner_password:
          type: string

    LeagueSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CreateTeamRequest:
      type: object
      required: [name, team_password, draft_order]
      properties:
        name:
          type: string
        team_password:
          type: string
        draft_order:
          type: integer
          minimum: 1

    TeamSummary:
      type: object
      required: [id, name, draft_order]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        draft_order:
          type: integer

    RosterSlotConfigItem:
      type: object
      required: [position, priority, is_starter, slot_count]
      properties:
        position:
          type: string
        priority:
          type: integer
        is_starter:
          type: boolean
        slot_count:
          type: integer

    RosterConfigRequest:
      type: object
      required: [bench_slots, slots]
      properties:
        bench_slots:
          type: integer
        slots:
          type: array
          items:
            $ref: "#/components/schemas/RosterSlotConfigItem"

    TeamListResponse:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamSummary"

    PlayerAavSourceEntry:
      type: object
      required: [source, aav_minor]
      description: One row per (player, source) — added by MOD-016's player_aav_sources restructuring.
      properties:
        source:
          type: string
          enum: [CSV, EXCEL, ESPN_PDF, FANTASYPROS]
        aav_minor:
          type: integer
        tier:
          type: integer
          nullable: true
        projected_points:
          type: number
          nullable: true

    PlayerEntry:
      type: object
      required: [player_id, dataset_entry_id, name, position, aav_minor]
      properties:
        player_id:
          type: string
          format: uuid
        dataset_entry_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: string
        nfl_team:
          type: string
        aav_minor:
          type: integer
          description: >-
            Average Auction Value in cents, resolved from the dataset's primary_aav_source
            (MOD-016). Kept top-level for backward compatibility with existing Draft Room/War Room
            consumers, equal to primary_aav_minor.
        projected_points:
          type: number
          nullable: true
        tier:
          type: integer
          nullable: true
        primary_aav_minor:
          type: integer
          nullable: true
          description: Added by MOD-016. Resolved from the dataset's selected primary_aav_source.
        secondary_aav_minor:
          type: integer
          nullable: true
          description: Added by MOD-016. Resolved from the dataset's selected secondary_aav_source, if any.
        aav_sources:
          type: array
          description: Added by MOD-016. Every AAV source currently loaded for this player in this dataset.
          items:
            $ref: "#/components/schemas/PlayerAavSourceEntry"
        bye_week:
          type: integer
          nullable: true
          description: Added by MOD-016.
        injury_status:
          type: string
          nullable: true
          description: Added by MOD-016.
        injury_detail:
          type: string
          nullable: true
          description: Added by MOD-016.
        injury_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Added by MOD-016.
        prior_season_stats:
          type: object
          nullable: true
          description: Added by MOD-016. Freeform per-source stat payload.

    PlayerListResponse:
      type: object
      required: [players]
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerEntry"

    AuctionConfigRequest:
      type: object
      required: [initial_budget_minor, nomination_timer_ms, second_bid_timer_ms, rebid_timer_ms]
      properties:
        initial_budget_minor:
          type: integer
          description: Per-team starting budget in cents
        nomination_timer_ms:
          type: integer
        second_bid_timer_ms:
          type: integer
        rebid_timer_ms:
          type: integer
        anti_snipe_threshold_ms:
          type: integer
        anti_snipe_extension_ms:
          type: integer
        min_bid_minor:
          type: integer
          default: 100

    DatasetSummary:
      type: object
      required: [id, status, version]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, VALIDATED, FROZEN]
        version:
          type: integer
        frozen_at:
          type: string
          format: date-time

    ImportError:
      type: object
      properties:
        row:
          type: integer
        message:
          type: string

    ImportResult:
      type: object
      required: [rows_imported, errors]
      properties:
        rows_imported:
          type: integer
        source:
          type: string
          enum: [CSV, EXCEL, ESPN_PDF, FANTASYPROS]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"

    CreateDraftRequest:
      type: object
      required: [dataset_id]
      properties:
        dataset_id:
          type: string
          format: uuid

    CreateDraftResponse:
      type: object
      required: [id, status, league_id]
      properties:
        id:
          type: string
          format: uuid
        league_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED]
        dataset_id:
          type: string
          format: uuid
