openapi: "3.1.0"
info:
  title: MOD-006 Draft Completion and Reports
  version: "1.0.0"
  description: |
    Post-draft summary report generation, ESPN worksheet download, and
    SendGrid email dispatch to all team owners.

security:
  - bearerAuth: []

paths:
  /drafts/{draftId}/report:
    get:
      operationId: getDraftReport
      summary: Get the post-draft summary report
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/draftId"
      responses:
        "200":
          description: Draft summary report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSummaryReport"

  /drafts/{draftId}/espn-worksheet:
    get:
      operationId: getEspnWorksheet
      summary: Download ESPN roster worksheet for manual entry
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/draftId"
      responses:
        "200":
          description: ESPN-formatted CSV/Excel file
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /drafts/{draftId}/report/email:
    post:
      operationId: emailDraftReport
      summary: Send draft summary email to all team owners via SendGrid
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/draftId"
      responses:
        "202":
          description: Email dispatch accepted (fire-and-forget)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDispatchResponse"

  /leagues/{leagueId}/espn-team-mappings:
    get:
      operationId: listEspnTeamMappings
      summary: List Team -> ESPN-team mappings (ProviderTeamMapping, provider_code=espn)
      tags: [espn-transfer]
      parameters:
        - $ref: "#/components/parameters/leagueId"
      responses:
        "200":
          description: Current mappings, one per internal Team (unmapped teams included with external fields null)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderTeamMapping"

  /leagues/{leagueId}/espn-team-mappings/{teamId}:
    put:
      operationId: setEspnTeamMapping
      summary: Commissioner sets/confirms one Team's ESPN-team mapping
      tags: [espn-transfer]
      parameters:
        - $ref: "#/components/parameters/leagueId"
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderTeamMappingRequest"
      responses:
        "200":
          description: Mapping set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTeamMapping"

  /drafts/{draftId}/canonical-export:
    get:
      operationId: getCanonicalExport
      summary: Canonical JSON export of every acquisition (ExportJob, provider_code=canonical)
      tags: [espn-transfer]
      parameters:
        - $ref: "#/components/parameters/draftId"
      responses:
        "200":
          description: Canonical JSON export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalExport"

  /drafts/{draftId}/reconciliation:
    get:
      operationId: getReconciliationStatus
      summary: Get reconciliation status for every ReconciliationItem in this draft's ExportJob
      tags: [espn-transfer]
      parameters:
        - $ref: "#/components/parameters/draftId"
      responses:
        "200":
          description: Reconciliation items with their current status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReconciliationItem"

  /drafts/{draftId}/reconciliation/{reconciliationItemId}/confirm:
    post:
      operationId: confirmReconciliationItem
      summary: Commissioner marks one ReconciliationItem CONFIRMED (player transfer verified in ESPN)
      tags: [espn-transfer]
      parameters:
        - $ref: "#/components/parameters/draftId"
        - name: reconciliationItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Item marked CONFIRMED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationItem"
        "409":
          description: Item is already CONFIRMED, or is AMBIGUOUS and must be resolved via setEspnTeamMapping first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    draftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    leagueId:
      name: leagueId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ReportAcquisitionEntry:
      type: object
      properties:
        player_name:
          type: string
        position:
          type: string
        price_minor:
          type: integer
        roster_slot:
          type: string

    ReportTeamEntry:
      type: object
      required: [team_id, team_name, acquisitions, final_budget_minor, projected_starter_points, roster_depth_score, aav_efficiency_pct]
      properties:
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
        final_budget_minor:
          type: integer
          description: Remaining unspent budget
        acquisitions:
          type: array
          items:
            $ref: "#/components/schemas/ReportAcquisitionEntry"
        projected_starter_points:
          type: number
          description: >-
            Sum of projected fantasy points for acquisitions whose active RosterEntry maps to an
            is_starter=true RosterSlotDefinition (PRD §36.1). Not an optimized weekly-lineup
            recommendation — reads the draft's existing starter-first assignment, does not recompute it.
        roster_depth_score:
          type: object
          required: [value, calculation_version]
          description: >-
            Separately labeled, versioned bench/depth-oriented figure, distinct from
            projected_starter_points (PRD §36.2).
          properties:
            value:
              type: number
            calculation_version:
              type: string
        aav_efficiency_pct:
          type: number
          description: >-
            Purchase price vs. the frozen dataset's aav_minor for this team's acquisitions (PRD §36.3).
            Labeled as AAV efficiency only — never owner skill or fair value (CLAUDE.md constraint #6).

    DraftSummaryReport:
      type: object
      required: [draft_id, completed_at, teams, league_totals]
      properties:
        draft_id:
          type: string
          format: uuid
        completed_at:
          type: string
          format: date-time
        teams:
          type: array
          items:
            $ref: "#/components/schemas/ReportTeamEntry"
        league_totals:
          type: object
          required: [spend_minor, aav_minor]
          description: >-
            League-wide totals for the League summary view (PRD §36.4, screen-information-architecture.md §18):
            total purchase price vs. total frozen-dataset AAV across every acquisition in the draft.
          properties:
            spend_minor:
              type: integer
            aav_minor:
              type: integer

    EmailDispatchResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        recipients:
          type: integer
          description: Number of team email addresses targeted

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ProviderTeamMappingRequest:
      type: object
      required: [external_team_id, external_team_name]
      properties:
        external_team_id:
          type: string
          nullable: true
        external_team_name:
          type: string
        verified:
          type: boolean

    ProviderTeamMapping:
      allOf:
        - $ref: "#/components/schemas/ProviderTeamMappingRequest"
        - type: object
          required: [league_id, provider_code, team_id]
          properties:
            league_id:
              type: string
              format: uuid
            provider_code:
              type: string
              enum: [espn]
            team_id:
              type: string
              format: uuid

    CanonicalExportAcquisition:
      type: object
      properties:
        player_id:
          type: string
          format: uuid
        player_name:
          type: string
        team_id:
          type: string
          format: uuid
        price_minor:
          type: integer
        roster_slot:
          type: string
        resolution_sequence:
          type: integer

    CanonicalExport:
      type: object
      required: [export_job_id, schema_version, status, acquisitions]
      properties:
        export_job_id:
          type: string
          format: uuid
        schema_version:
          type: string
        status:
          type: string
          enum: [PENDING, VALIDATED, GENERATED, FAILED]
        acquisitions:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalExportAcquisition"

    ReconciliationItem:
      type: object
      required: [id, export_job_id, team_id, player_id, status]
      properties:
        id:
          type: string
          format: uuid
        export_job_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        recommended_target_slot:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, CONFIRMED, AMBIGUOUS, FAILED]
        confirmed_by_user_id:
          type: string
          format: uuid
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
