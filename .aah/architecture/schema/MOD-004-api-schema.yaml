openapi: "3.1.0"
info:
  title: MOD-004 Auto-Agent
  version: "1.0.0"
  description: |
    Configure Auto-Agent willingness and manually toggle control mode.
    Mode transitions (AUTO_AGENT ↔ MANUAL) are broadcast as DraftEvents.

security:
  - bearerAuth: []

paths:
  /drafts/{draftId}/teams/{teamId}/auto-agent:
    put:
      operationId: setAutoAgentConfig
      summary: Configure Auto-Agent willingness ceiling for a team
      tags: [auto-agent]
      parameters:
        - $ref: "#/components/parameters/draftId"
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoAgentConfigRequest"
      responses:
        "200":
          description: Auto-agent configuration saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoAgentConfigResponse"

  /drafts/{draftId}/teams/{teamId}/control-mode:
    patch:
      operationId: setControlMode
      summary: Manually toggle a team between MANUAL and AUTO_AGENT control
      tags: [auto-agent]
      parameters:
        - $ref: "#/components/parameters/draftId"
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlModeRequest"
      responses:
        "200":
          description: Control mode updated and broadcast to all clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlModeResponse"

x-websocket-events:
  description: |
    Auto-agent control mode changes are broadcast to all draft clients.
  events:
    - type: TEAM_AUTO_AGENT_ENABLED
      payload:
        team_id: uuid
        triggered_by: "disconnect_grace | manual"

    - type: TEAM_AUTO_AGENT_DISABLED
      payload:
        team_id: uuid
        triggered_by: "owner"

    - type: TEAM_RECONNECTED
      payload:
        team_id: uuid
        triggered_by: "owner"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    draftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    teamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    AutoAgentConfigRequest:
      type: object
      description: |
        Per-player willingness ceiling configuration (state-machine-flows.md §11,
        data-model.md §10.5). Partial update — all fields optional; omitted
        fields keep their current (or default) value. Replaces the prior flat
        willingness_pct-of-total-budget field.
      properties:
        use_owner_target_when_customized:
          type: boolean
          description: Prefer the team's customized Owner Target over Primary AAV, when one exists
        fallback_to_primary_aav:
          type: boolean
          description: Fall back to the dataset's Primary AAV when no customized Owner Target exists
        max_over_base_pct:
          type: number
          format: float
          minimum: 0.0
          description: Cap the varied value at base * (1 + max_over_base_pct)
        random_variance_pct:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Stable ± variance applied to the base value, per team+player
        bench_value_pct:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Discount applied when the player would not fill a currently-unfilled starter slot
        prioritize_starters:
          type: boolean
          description: Use the full (undiscounted) value when the player would fill a starter slot

    AutoAgentConfigResponse:
      type: object
      required:
        - team_id
        - use_owner_target_when_customized
        - fallback_to_primary_aav
        - max_over_base_pct
        - random_variance_pct
        - bench_value_pct
        - prioritize_starters
      properties:
        team_id:
          type: string
          format: uuid
        use_owner_target_when_customized:
          type: boolean
        fallback_to_primary_aav:
          type: boolean
        max_over_base_pct:
          type: number
        random_variance_pct:
          type: number
        bench_value_pct:
          type: number
        prioritize_starters:
          type: boolean

    ControlModeRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [MANUAL, AUTO_AGENT]

    ControlModeResponse:
      type: object
      required: [team_id, control_mode]
      properties:
        team_id:
          type: string
          format: uuid
        control_mode:
          type: string
          enum: [MANUAL, AUTO_AGENT]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
