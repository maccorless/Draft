openapi: "3.1.0"
info:
  title: MOD-009 Whammy
  version: "1.0.0"
  description: |
    Commissioner-triggered Whammy events: random budget or entertainment events
    flowing through the Budget Ledger. Whammy is optional and configured per-league.

security:
  - bearerAuth: []

paths:
  /drafts/{draftId}/whammy:
    post:
      operationId: triggerWhammy
      summary: Commissioner triggers a Whammy event for a target team
      tags: [whammy]
      parameters:
        - $ref: "#/components/parameters/draftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhammyRequest"
      responses:
        "200":
          description: >-
            Whammy applied immediately (WhammyResponse), or — when the league's
            WhammyConfig.commissioner_approval_required is true — queued instead with
            no budget effect yet (WhammyPendingApprovalResponse). The UI branches on
            the presence of `status: PENDING_APPROVAL`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WhammyResponse"
                  - $ref: "#/components/schemas/WhammyPendingApprovalResponse"
        "409":
          description: >-
            One of WHAMMY_DISABLED, WHAMMY_POSITIVE_NOT_ALLOWED,
            WHAMMY_NEGATIVE_NOT_ALLOWED, WHAMMY_MAX_PER_TEAM_EXCEEDED,
            WHAMMY_MAX_PER_DRAFT_EXCEEDED, or WHAMMY_ROSTER_COMPLETION_INFEASIBLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /drafts/{draftId}/whammy/{whammyId}/approve:
    post:
      operationId: approveWhammy
      summary: Commissioner approves a pending Whammy (PENDING_APPROVAL -> APPLIED)
      tags: [whammy]
      parameters:
        - $ref: "#/components/parameters/draftId"
        - $ref: "#/components/parameters/whammyId"
      responses:
        "200":
          description: Whammy approved and applied; BudgetLedgerEntry created; WHAMMY_APPLIED broadcast sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhammyResponse"
        "409":
          description: >-
            WHAMMY_NOT_PENDING (event is not in PENDING_APPROVAL status), or
            WHAMMY_ROSTER_COMPLETION_INFEASIBLE (re-checked at approval time — the
            situation may have changed since the whammy was queued).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /drafts/{draftId}/whammy/{whammyId}/reject:
    post:
      operationId: rejectWhammy
      summary: Commissioner rejects a pending Whammy (PENDING_APPROVAL -> REJECTED)
      tags: [whammy]
      parameters:
        - $ref: "#/components/parameters/draftId"
        - $ref: "#/components/parameters/whammyId"
      responses:
        "200":
          description: Whammy rejected; no budget effect applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhammyRejectResponse"
        "409":
          description: WHAMMY_NOT_PENDING — event is not in PENDING_APPROVAL status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

x-websocket-events:
  events:
    - type: WHAMMY_APPLIED
      payload:
        team_id: uuid
        amount_minor: integer
        description: string
        new_remaining_budget_minor: integer
      description: Broadcast to all draft clients when a Whammy fires.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    draftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    whammyId:
      name: whammyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    WhammyRequest:
      type: object
      required: [team_id, amount_minor, description]
      properties:
        team_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          description: Budget delta in cents; negative = debit (penalty), positive = credit (bonus)
        description:
          type: string
          description: Human-readable label for the Whammy event

    WhammyResponse:
      type: object
      required: [team_id, amount_minor, new_remaining_budget_minor]
      properties:
        team_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
        new_remaining_budget_minor:
          type: integer

    WhammyPendingApprovalResponse:
      type: object
      required: [whammy_id, status, team_id, amount_minor]
      description: >-
        Returned by triggerWhammy in place of WhammyResponse when the league's
        WhammyConfig.commissioner_approval_required is true. No budget effect yet.
      properties:
        whammy_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING_APPROVAL]
        team_id:
          type: string
          format: uuid
        amount_minor:
          type: integer

    WhammyRejectResponse:
      type: object
      required: [whammy_id, status]
      properties:
        whammy_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REJECTED]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
