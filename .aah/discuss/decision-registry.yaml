- slug_id: empty-nomination-queue
  area: Solution Flow & Edge Cases
  question: What happens when a team's nomination queue is empty and their turn expires?
  options_presented: []
  options_eliminated: []
  response: System auto-nominates the highest-AAV available (not-yet-awarded) player
    from the frozen dataset
  response_type: single-select
  source: user
  activates: []
  notes: 'On nomination timer expiry with empty queue: server runs argmax(aav_minor)
    over DraftDataset players where player_id NOT IN resolved PlayerAuction results;
    this player is nominated at the minimum bid; commissioner can still pause before
    this fires if needed; PRD did not specify this behavior — user-defined policy'
- slug_id: anti-sniping-config
  area: Solution Flow & Edge Cases
  question: Can the commissioner change anti-sniping extension mid-draft and when
    does it apply?
  options_presented: []
  options_eliminated: []
  response: Per-auction override allowed during draft; change applies to the NEXT
    auction, not the currently-running one
  response_type: single-select
  source: user
  activates: []
  notes: User chose per-auction override; applying to next auction (not current) avoids
    race with active Rebid timer; commissioner UI shows current setting and a pending-next
    value; config stored on AuctionConfiguration with a pending_override column or
    draft-level override that supersedes league default
- slug_id: crash-recovery-ux
  area: Solution Flow & Edge Cases
  question: What do owners see when the server restarts and the draft is paused?
  options_presented: []
  options_eliminated: []
  response: 'Auto-reconnect with visible status banner: ''Reconnecting...'' then ''Draft
    paused — waiting for commissioner'''
  response_type: single-select
  source: user
  activates: []
  notes: WS client detects close event; shows reconnecting banner; retries with exponential
    backoff (1s, 2s, 4s, max 5s); on AUTH success receives snapshot and sees PAUSED
    state; commissioner console shows pause notification with PAUSED reason = SERVER_RESTART
- slug_id: nominator-match-race
  area: Solution Flow & Edge Cases
  question: How is a simultaneous Nominator Match collision handled?
  options_presented: []
  options_eliminated: []
  response: First WS receipt wins; second is rejected with NOMINATOR_MATCH_CONSUMED
  response_type: single-select
  source: inferred
  activates: []
  notes: Per-draft command queue serializes all commands; only one NOMINATOR_MATCH
    command processes at a time; second command sees match_used=true and is rejected
    cleanly; no special handling needed — serialization model covers this
