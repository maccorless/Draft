domain: "live-draft"
last_updated: "2026-09-01T03:25:00Z"
last_updated_after_feature: "brownfield-import"

narrative: |
  The live-draft domain owns all real-time auction state: the Draft FSM (UPCOMING/RUNNING/PAUSED/COMPLETE), the PlayerAuction FSM (SECOND_BID_OPEN/REBID_OPEN/RESOLVING/AWARDED/REVERSED), nomination turn management, bid validation pipeline, and resolution (Acquisition + BudgetLedgerEntry + RosterEntry). All mutations flow through a per-draft serialized command queue — one in-flight command per draft_id at a time — ensuring no two commands race against the same stale state. This is the highest-consequence domain: bugs here corrupt live draft state.

source_files:
  - path: "server/src/draft/command-queue.ts"
    line_range: "PLANNED"
    role: "Per-draft serialized queue; all mutating commands route through here"
  - path: "server/src/draft/nomination/index.ts"
    line_range: "PLANNED"
    role: "Nomination turn flow, timer management, NominationQueueEntry fallback"
  - path: "server/src/draft/bid/pipeline.ts"
    line_range: "PLANNED"
    role: "Full bid validation: auth → dedup → deadline → bid-type → roster/budget → anti-snipe → persist"
  - path: "server/src/draft/resolution/index.ts"
    line_range: "PLANNED"
    role: "Resolution transaction: Acquisition + debit ledger + starter-first RosterEntry + commit + broadcast"
  - path: "server/src/draft/auto-agent/index.ts"
    line_range: "PLANNED"
    role: "Auto-Agent control mode, willingness calc, bidding cadence"

flow_traces:
  - name: "bid-atomicity-pipeline"
    description: "Full lifecycle of an accepted bid from WS receipt to broadcast"
    steps:
      - "ws/handler.ts: stamp server_receipt_time BEFORE first await"
      - "auth/middleware.ts: validate token + auth_epoch (re-read from DB)"
      - "draft/bid/pipeline.ts: dedup idempotency_key"
      - "draft/command-queue.ts: enqueue, wait for queue slot"
      - "draft/bid/pipeline.ts: lock PlayerAuction, check deadline, validate bid type"
      - "draft/bid/pipeline.ts: roster + budget check (max_legal_bid formula)"
      - "draft/bid/pipeline.ts: anti-snipe classification"
      - "DB: BEGIN; INSERT BidAttempt; INSERT DraftEvent (seq allocated here); COMMIT"
      - "draft/command-queue.ts: update in-memory state ONLY after commit"
      - "ws/handler.ts: broadcast DraftEvent to all draft sessions"
  - name: "resolution"
    description: "PlayerAuction resolves to AWARDED after deadline expires"
    steps:
      - "Timer fires: PlayerAuction deadline reached"
      - "draft/command-queue.ts: enqueue resolution command"
      - "draft/resolution/index.ts: lock PlayerAuction, determine winner, validate still legal"
      - "draft/resolution/index.ts: starter-first RosterEntry slot selection"
      - "DB: BEGIN; INSERT Acquisition (resolution_sequence); INSERT BudgetLedgerEntry; INSERT RosterEntry; UPDATE DraftTeamState; INSERT DraftEvent; COMMIT"
      - "In-memory update post-commit; broadcast PLAYER_AWARDED"
  - name: "nomination-turn"
    description: "Nominator is selected and opens a PlayerAuction"
    steps:
      - "draft/nomination/index.ts: select next eligible nominator (skip complete rosters)"
      - "If MANUAL: start Nomination Timer"
      - "If owner misses: check NominationQueueEntry first, then fallback policy"
      - "If AUTO_AGENT: agent nominates immediately"
      - "DB: INSERT PlayerAuction (SECOND_BID_OPEN); INSERT DraftEvent; COMMIT"
      - "Broadcast NOMINATION_STARTED; start Second-Bid Timer"

integration_points:
  - target: "auth"
    mechanism: "auth_epoch re-read from DB on every command"
    direction: "inbound"
  - target: "player-data"
    mechanism: "DraftDataset.id referenced by PlayerAuction for player identity"
    direction: "inbound"
  - target: "ws-handler"
    mechanism: "Commands arrive via WS; DraftEvent broadcasts exit via WS"
    direction: "bidirectional"
  - target: "corrections"
    mechanism: "Rollback uses resolution.ts primitives in reverse; price correction replays ledger"
    direction: "bidirectional"

known_issues:
  - description: "server_receipt_time placement must be before first await — easy to accidentally move inside async lambda"
    severity: "high"
    workaround: "Code review gate: grep for server_receipt_time assignment, confirm it precedes any await in the same function scope"
  - description: "If resolution timer fires while DB is down, auto-pause in memory (unsequenced control frame) and require commissioner resume — do not attempt a sequenced event with a failing DB"
    severity: "high"
    workaround: "Resolution failure branch: catch DB error, set in-memory draft status to PAUSED, reject command, alert commissioner"
  - description: "Auto-Agent first bid never fires if trigger is only 'lost leadership' — an agent that never led never bids on a fresh nomination"
    severity: "high"
    workaround: "Trigger cadence on auction open AND leadership change, not only leadership change"

patterns:
  - name: "per-draft-serialized-queue"
    description: "Map<draft_id, AsyncQueue> where each queue processes one command at a time. All mutating handlers are queue.push(async () => { ... }) — never called directly."
    example_file: "server/src/draft/command-queue.ts:PLANNED"
  - name: "commit-then-update-memory"
    description: "DB commit is awaited; only on success do we update in-memory state and call broadcast. On DB error: leave memory untouched, reject command to client."
    example_file: "server/src/draft/resolution/index.ts:PLANNED"
