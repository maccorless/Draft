feedback_details: |
  Two related Draft Room UX additions, both prompted by reference screenshots the user
  shared of another auction-draft product:

  1. Persistent, filterable, sortable player list for nomination. Current state
  (web/src/screens/draft-room/index.tsx): `availablePlayers` (~lines 307-313) only
  returns matches when `nominateSearch` has text, rendered as a small results list
  (~lines 552-566) only during the owner's own nomination turn. There is no persistent
  full list, no position filter, and no default sort. Required: (1) a persistent list of
  all undrafted players from the DatasetPlayer set already loaded client-side (fields
  confirmed present: position, aav_minor, projected_points), filterable by position
  (tabs: All / QB / RB / WR / TE / FLEX-eligible / K / DEF per the league's
  roster_slot_definitions), default-sorted by aav_minor descending then
  projected_points descending as a tiebreak; (2) selecting a player from that list when
  it's the owner's nomination turn nominates them, reusing the existing
  handleNominate(entryId, aavMinor) flow (line 357) and min-bid default (line 358) —
  same behavior as the current search-result click, just sourced from the persistent
  list instead of only from search results. Reference UI: a FantasyPros-style
  "Rankings" panel with position tabs and a one-click draft action per row.

  2. Compact team-by-team strip across the top of the Draft Room: all teams in
  nomination order, each showing team icon/name and remaining budget, and — whenever a
  Player Auction is open — that team's current bid amount highlighted if they are the
  leader. Data already available: /drafts/:draftId/roster-grid already returns each
  team's remaining_budget_minor and control_mode, and the live auction WS state already
  carries current_leader_id and the current bid amount for the open PlayerAuction —
  this is a new rendering surface in Draft Room, not new backend data. Scoping note:
  PRD §25 (Draft View) lists only the owner's own remaining budget as prominent Draft
  Room content; all-teams budgets are normally a War Room (§26) concern per the
  Draft-Room-is-for-acting/War-Room-is-for-thinking split (§2.2). The user explicitly
  asked for this compact all-teams strip in the Draft Room itself, so it is scoped as a
  deliberate small addition to the Draft Room's own surface, not a duplicate of the War
  Room's fuller team/budget tables.

  Explicitly NOT part of this feedback item (investigated and resolved outside aah-fix,
  reported directly to the user): a report that Auto-Agent bidding was producing $1
  wins for every player in a currently-running mock draft was root-caused as a
  per-draft configuration state (all 12 teams stuck in MANUAL control mode with nobody
  bidding), not a code defect — the AAV-anchored willingness-ceiling algorithm itself
  was independently verified correct and unchanged.
