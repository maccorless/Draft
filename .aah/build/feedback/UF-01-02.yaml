feedback_details: |
  Implement the missing auto-nomination behavior specified in knowledge/state-machine-flows.md §2 (Nomination Turn Flow), tracked as a known issue against F-MOD-002: "auto-nomination on expired turn not yet implemented (requires nomination cursor timer)". Two related gaps, both in the nomination-turn path (server/src/auction/engine.ts advanceNominationTurn and server/src/auction/auto-agent.ts):
  1. AUTO_AGENT team's turn: per the flowchart, when the next eligible
     nominating team's control_mode is AUTO_AGENT, Auto-Agent must
     immediately choose a legal nomination — no timer wait. Currently
     auto-agent.ts only reacts to bids/nominations already in flight; nothing
     nominates proactively on that team's behalf.
  2. MANUAL team's turn, timer expires: currently advanceNominationTurn only
     broadcasts NOMINATION_TURN_CHANGED with no enforced deadline. Per spec,
     if the owner does not submit a legal nomination before the nomination
     timer deadline, the system must: (a) use the first legal entry in that
     team's Nomination Queue (nomination_queue_items /
     getTopNominationQueueEntry in server/src/draft/strategy.ts) at its
     configured opening amount if one exists, else (b) fall back to a default
     nomination policy.

  Default nomination policy (resolved with user via AskUserQuestion): the highest remaining-AAV undrafted player at a position where the nominating team still has an open roster slot (starter or bench), excluding any player on that team's Do Not Draft list. This same fallback also applies to case 1 (AUTO_AGENT team, no Nomination Queue entry). Opening bid for both auto- nomination paths (queue fallback and default-policy fallback) uses the auction configuration's min_bid_minor unless the Nomination Queue entry specifies its own opening amount.
  Both auto-nominations must create the PlayerAuction through the same path as a manual NOMINATE_COMMAND (processNominateCommand with systemNominated: true — this flag already exists and is threaded into the NOMINATION_STARTED payload as system_nominated), so second-bid timer start, DraftEvent append, and triggerAutoAgentBidsOnNomination for other AUTO_AGENT teams all fire identically to a manual nomination. Existing behavior that must be preserved: teams with a completed roster are skipped in nomination order (state-machine-flows.md §2 "A team with a complete roster is skipped in future nomination order").
  Context: surfaced while trying to run a full 12-team mock draft with every team set to AUTO_AGENT control mode — the draft currently stalls forever after DRAFT_STARTED because nothing ever nominates the first player.
steps:
- phase: plan
  input: >
    Extend F-MOD-002 (Live Auction Engine with Bid Pipeline) to close the
    auto-nomination gap: (1) when advanceNominationTurn (server/src/auction/engine.ts)
    selects a next nominating team whose draft_team_states.control_mode is
    AUTO_AGENT, immediately auto-nominate on that team's behalf instead of
    waiting on any timer; (2) when the next team is MANUAL, start/track a
    nomination-turn deadline using the auction configuration's
    nomination_timer_ms and, if it expires with no NOMINATE_COMMAND received,
    auto-nominate on that team's behalf. Both auto-nomination paths pick a
    player via: first legal entry in the team's Nomination Queue
    (server/src/draft/strategy.ts getTopNominationQueueEntry) at its
    configured opening amount if present; otherwise the highest remaining-AAV
    undrafted player at a position where the team has an open roster slot
    (starter or bench), excluding that team's Do Not Draft list
    (server/src/draft/do-not-draft.ts), opened at min_bid_minor. Route the
    resulting nomination through the existing processNominateCommand path
    with systemNominated: true so second-bid timer start, DraftEvent append,
    and triggerAutoAgentBidsOnNomination (server/src/auction/auto-agent.ts)
    all fire exactly as they do for a manual nomination, and enqueue the
    auto-nomination onto that draft's existing AsyncQueue
    (server/src/auction/queue.ts) rather than a new code path. Preserve
    existing behavior: teams with a completed roster remain skipped in
    nomination order. This is F-MOD-004 (Auto-Agent Mode)'s natural extension
    point for the "proactively nominate" half of Auto-Agent behavior, and
    touches F-MOD-008's Nomination Queue (server/src/draft/strategy.ts) as a
    read dependency only (no change to Watch List/Nomination Queue CRUD
    itself). Classify as a rework of F-MOD-002 (and update F-MOD-004's spec
    if the auto-nomination trigger is better owned there) — F-MOD-002 and
    F-MOD-004 are both already built and passing; this is Case 1 or Case 2
    per aah-fix's rework classification depending on whether they're already
    promoted. The remaining blast_radius_features (F-MOD-003, 005, 006,
    009-015, 017) are downstream DAG dependents only — do not pre-rework them
    unless their own spec's acceptance criteria are actually violated by this
    change; leave collateral-damage detection to the regression/runtime gates
    per aah-fix's reactive-handling rule.
