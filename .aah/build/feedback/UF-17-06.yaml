feedback_details: |
  Discovered via post-draft data analysis of the completed mock draft (draft 2ba2abdb-936e-4f0c-bfac-841bedc69d1c, 12 teams, all AUTO_AGENT): two teams won more auctions than their roster has slots for, and the excess wins silently vanished instead of being prevented. Verified independently against the live dev database: Epsilon Eagles (677a9ee5-8d37-42ad-8127-d6eb3884cc4f) has 25 active `acquisitions` rows but only 15 active `roster_entries` rows (10 acquisitions have no roster slot at all) — ended the draft with $2 unspent and $0 kickers, despite paying for 25 "wins". Theta Tigers (bdff42dc-b6fa-47fc-a13e-cbb85df365dc) has 18 acquisitions vs 14 roster_entries, ending at $0 with slots still unfilled.
  Root cause, traced in server/src/auction/engine.ts: 1. `computeMaxLegalBid()` (~line 221-227) computes `remaining_budget_minor - Math.max(0, required_remaining_spots - 1) * 100`. When `required_remaining_spots` is 0 (roster — starters + bench — completely full), this term is 0, so `max_legal_bid` collapses to the team's full `remaining_budget_minor`. There is no check anywhere in bid validation (~line 415-452, the `EXCEEDS_MAX_LEGAL_BID` check) that the team has ANY roster room left at all — a team with a 100% full roster can still submit and win bids, because this formula only reserves budget for OTHER future picks, it was never meant to gate "can I pick at all." 2. `assignRosterSlot()` (~line 1142-1195) correctly returns `null` when no starter or bench slot matches (its own comment: "should not happen if roster is configured correctly" — it evidently does happen). But `awardAuction()` (~line 1210 onward) proceeds unconditionally regardless: it always inserts the `Acquisition`, always charges the budget via `budget_ledger_entries`, always increments `draft_team_states.roster_filled_count` and decrements `required_remaining_spots`, and only conditionally skips the `roster_entries` INSERT `if (slot)`. So a team can spend money and have its filled-count/spots-remaining metrics updated as if a slot was filled, while the player is never actually assigned anywhere and effectively disappears from the roster. 3. The Auto-Agent bid triggers (server/src/auction/auto-agent.ts, triggerAutoAgentBidsOnNomination and triggerAutoAgentBidsOnLeaderChange) already correctly filter full-roster teams OUT of NOMINATION eligibility elsewhere in engine.ts (`required_remaining_spots <= 0` checks at ~line 1012 and ~1081, "completed roster — never re-selected"), but the two bid-trigger queries have no equivalent `dts.required_remaining_spots > 0` filter in their WHERE clause — so a full-roster Auto-Agent team keeps bidding even though it would never be selected to nominate.
  Fix (two parts, both needed): a) In engine.ts's bid-validation path, reject any bid with a new rejection code (e.g. ROSTER_FULL) when the bidding team's `required_remaining_spots <= 0`, regardless of `max_legal_bid` — a team with a completely full roster cannot legally place any further bid. This protects both manual and Auto-Agent bidders since it lives in the shared validation path. b) In auto-agent.ts, add `AND dts.required_remaining_spots > 0` to both trigger queries so a full-roster Auto-Agent team is never even considered for a bid trigger (consistent with how nomination eligibility already works) — this is a defense-in-depth/efficiency companion to (a), not a substitute for it. As additional defense-in-depth (optional but recommended): make `awardAuction()` treat `assignRosterSlot()` returning `null` as a hard failure (throw, causing `processAwardCycle`'s existing per-auction try/catch to log it) rather than silently proceeding to charge budget and update team-state counters for a player that gets no roster slot — so if this state is ever reached again despite (a)/(b), it fails loudly instead of silently corrupting team state.
  This does not affect data already produced by the completed mock draft (that data can simply be discarded/reseeded); the fix is about preventing this from ever happening again.
