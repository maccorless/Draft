feedback_details: |
  Feature gap found while watching the mock draft run live: the Draft Room's "My Roster" panel (web/src/screens/draft-room/index.tsx, ~lines 470-486, data-testid="my-roster") only shows starter/bench slot fill counts (e.g. "QB 1/1", "Bench 3/7") — it never shows which player was drafted into each slot or what price was paid. During a live auction, the owner should be able to see, per acquired player: the player's name and the price they paid for him. The data already exists — RosterEntry rows join to Acquisition (purchase_price_minor) and Player (name); the post-draft summary report (server/src/draft/reports.ts, ~lines 155-220) already runs exactly this join (acquisitions JOIN players ON ... -> player_name, purchase_price_minor) for the completed-draft report, but that data is not exposed anywhere during the live draft. Fix: extend GET /drafts/:draftId/roster-grid (server/src/draft/war-room.ts) — or add a parallel field to it — so each team's response includes the acquired player's name and purchase_price_minor per filled roster slot (not just aggregate counts), and update the Draft Room "My Roster" panel to render each filled slot's player name and price paid alongside the existing slot-count/status display (starter vs. bench distinction stays as-is).
