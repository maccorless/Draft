feedback_details: |
  Reported live while reviewing the app (Draft Room / Commissioner Console), with a reference screenshot of a commercial fantasy draft tool (FantasyPros Draft Simulator) attached for design inspiration only.
  1. BUG (confirmed root cause): server/src/auction/engine.ts line 396 builds
     the BID_REJECTED "reason" string as
     `Bid ${command.bid_amount_minor} must exceed current ${auction.current_bid_minor}`
     — raw *_minor integer cents interpolated directly into a user-facing
     message instead of being formatted as whole dollars (e.g. 2600 shown
     instead of $26). Same pattern likely exists in other BID_REJECTED reason
     strings in engine.ts (STALE_STATE, AUCTION_NOT_OPEN, and the
     max-legal-bid rejection) — audit all user-facing reason strings in
     engine.ts for raw *_minor leakage and format through the same
     dollar-formatting the web client already uses (formatMoney in
     web/src/screens/draft-room/index.tsx) — either format server-side before
     sending, or keep the reason machine-readable/code-only server-side and
     have the client format amounts into its own displayed message using the
     `code` field plus structured amounts, whichever fits the existing
     BID_REJECTED payload contract in shared-types best.

     Separately, confirmed how a legitimate "Bid X must exceed current X"
     rejection (bid_amount_minor == current_bid_minor) can arise: the client's
     "+$1" relative-bid button (web/src/screens/draft-room/index.tsx line 278)
     computes `auction.current_bid_minor + 100` from its OWN local React
     state at click time rather than having the server compute the increment
     from a server-side current value. A rapid double-click, or a click that
     races an incoming BID_ACCEPTED/leader-change broadcast the client hasn't
     applied to local state yet, can produce a bid_amount_minor equal to (or
     behind) the true current price by the time the server processes it. Fix
     scope: prevent/handle this client-side (disable the +$1 button
     immediately on click until the pending request resolves or a fresh
     auction state arrives — standard optimistic-UI debounce) so a legitimate
     race surfaces as a clear "someone just bid — try again" style message
     rather than a raw BID_TOO_LOW with cents in it. Do not change the
     server's stale-state/BID_TOO_LOW validation logic itself — it is correct
     (rejects bid_amount_minor <= current_bid_minor); this is a message-
     formatting and client-side UX fix, not a bid-pipeline correctness bug.

  2. GAP to verify: commissioner edits to AuctionConfiguration's
     nomination_timer_ms / second_bid_timer_ms / rebid_timer_ms should take
     effect starting with the very next PlayerAuction/nomination turn, not
     require a restart. Verify server/src/auction/engine.ts's nomination and
     second-bid/rebid timer scheduling (dispatchNominationTurn,
     processNominateCommand, and wherever second_bid_timer_ms/rebid_timer_ms
     are read) re-reads auction_configurations fresh per auction/turn rather
     than caching a value at draft-start or server-boot time. If it already
     re-reads fresh every time (dispatchNominationTurn does, per
     F-MOD-002-rework-01), confirm the commissioner-facing config-edit route
     (server/src/league/routes.ts AuctionConfiguration update) doesn't require
     restarting the draft/server for the new value to be picked up, and add a
     regression test proving a mid-draft config edit changes the NEXT
     nomination's timer without a restart. If a caching gap is found, fix it.

  3. Missing UI affordance: an owner who is also the commissioner needs a
     visible "Pause Draft" action reachable from within their own Draft Room
     screen (web/src/screens/draft-room/), not only from the separate
     Commissioner Console (web/src/screens/commissioner/DraftControl.tsx).
     Clicking it should pause the draft (existing POST /drafts/:id/pause) and
     take them into Commissioner Console controls.

  4. Navigation gap: confirm/add a clear way for an owner to open their War
     Room (web/src/screens/war-room/) in addition to their Draft Room — per
     CLAUDE.md, "Same owner may open both as synchronized windows sharing one
     team identity," implying a link/button in the Draft Room (and vice
     versa) to open the other as a separate window, not just direct URL
     knowledge.

  5. UX gap: the Draft Room should always display the viewing owner's own
     roster-so-far with starter vs. bench slot status clearly visible (which
     starter slots are filled/open, bench count), so the owner always knows
     what roster needs remain. Ground this in
     knowledge/screen-information-architecture.md's Draft Room section and
     the existing RosterEntry/roster_slot_definitions data already available
     server-side.

  6. UX/layout: general feedback that the Draft Room has a lot of unused
     screen real estate and needs a design/layout pass. Evaluate using this
     repo's available UI/UX skills (design-review, frontend-design,
     ui-ux-pro-max) and, for inspiration only (not a spec to copy), the
     attached reference screenshot of a commercial draft simulator showing a
     rankings/players panel with tabs, a center suggestions/board panel, and
     a right sidebar with pick order + other teams' remaining needs. This
     app's own knowledge/screen-information-architecture.md and any existing
     design-spec.yaml remain authoritative for what the Draft Room must show;
     the layout pass should better use the freed/underused space to surface
     items 3-5 (pause action, War Room link, own-roster-with-needs) plus
     whatever else the IA doc calls for that isn't currently visible, rather
     than adopting the reference tool's specific feature set.

  Routing intent: items 1-2 are bug/verification fixes (server + client), scoped to the auction module (F-MOD-002) and possibly a dedicated web client fix. Items 3-6 are a UI/UX-focused rework of the Draft Room screen (and War Room cross-navigation) — likely lands on whichever feature/module owns web/src/screens/draft-room and web/src/screens/war-room per module-map.yaml. All were reported together in one live-review session and should be planned together but may span more than one feature depending on module ownership.
