feedback_details: |
  Fix the pre-existing repo-wide bug where DraftEvent/payload JSONB columns are double-encoded: writes throughout server/src/auction/engine.ts, server/src/draft/whammy.ts, server/src/draft/draft-control.ts (and any other module doing `${JSON.stringify(x)}::jsonb` inserts) store `payload` as a JSON string inside a jsonb column instead of a native jsonb object. This was discovered and only locally worked around (via `(payload #>> '{}')::jsonb ->> 'key'`) in the new query added in feature F-MOD-005-rework-01 (server/src/draft/corrections.ts). Fix at the source: correct the write side so payload is inserted as a proper jsonb object (not a double-encoded string), update any read-side code that currently compensates for the double-encoding (including the workaround just added in corrections.ts, which should revert to a normal jsonb read once the write side is fixed), and confirm no regressions across the affected modules' existing tests. (feature: F-MOD-005-rework-01)
